version: "2"
run:
  timeout: 5m
  issues-exit-code: 1
  tests: true
linters:
  default: all
  disable:
    - dupl
    - err113
    - errorlint
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - godot
    - lll
    - mnd
    - nestif
    - nlreturn
    - testpackage
    - unparam
    - wrapcheck
    - wsl
    # Linters added after golangci-lint v1.33, the version this config was written for.
    # They are off so the v2 migration keeps the v1 rule set; enable them deliberately.
    # depguard is listed too: v2 runs it with a deny-by-default rule when it has no rules.
    - containedctx
    - copyloopvar
    - cyclop
    - depguard
    - embeddedstructfieldcheck
    - exhaustruct
    - forbidigo
    - forcetypeassert
    - funcorder
    - godoclint
    - interfacebloat
    - intrange
    - ireturn
    - modernize
    - noinlineerr
    - nonamedreturns
    - revive
    - tagalign
    - tagliatelle
    - testifylint
    - varnamelen
    - wsl_v5
    # Deprecated in v2.12 and unconfigured here, so it never checked anything.
    - gomodguard
    - canonicalheader
    - dupword
    - fatcontext
    - nilnil
    - perfsprint
    - usestdlibvars
    - usetesting
    # Tests here share package-level config (e.g. pkg/logger/log), so making every test
    # parallel would introduce data races. Use t.Parallel() only where a test is isolated.
    - paralleltest
  settings:
    goheader:
      values:
        regexp:
          YEAR: (2018|2019|2020|2021|2022|2023|2024|2025|2026)(-)?(2019|2020|2021|2022|2023|2024|2025|2026)?
      template: |-
        Copyright {{ YEAR }} AccelByte Inc

        Licensed under the Apache License, Version 2.0 (the "License");
        you may not use this file except in compliance with the License.
        You may obtain a copy of the License at

        http://www.apache.org/licenses/LICENSE-2.0

        Unless required by applicable law or agreed to in writing, software
        distributed under the License is distributed on an "AS IS" BASIS,
        WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
        See the License for the specific language governing permissions and
        limitations under the License.
    govet:
      disable:
        - fieldalignment
      enable-all: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Test fixtures (IDs, permission strings) read better inline than as constants.
      - path: _test\.go$
        linters:
          - goconst
      - path: (.+)\.go$
        text: ^G104
      - path: (.+)\.go$
        text: ^G501
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-same-issues: 20
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
